[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldie-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "optuna>=4.4,<5",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.scripts]
goldie-replay-backtest = "goldie_api.replay_backtest:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8"
]

[tool.hatch.build.targets.wheel]
packages = ["src/goldie_api"]
