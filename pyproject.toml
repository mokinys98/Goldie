[project]
name = "goldie-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/trading-domain",
  "apps/api",
  "apps/market-data-collector",
  "apps/ingestion-worker",
  "apps/worker",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/test_api.py" = ["E402", "I001"]
"tests/test_shadow_service.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
